<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimoire Books</title>
    <script>
      // Apply the theme before first paint so there's no flash of the wrong
      // canvas. Dark is the default; see src/lib/theme.ts.
      try {
        var stored = localStorage.getItem("grimoire.theme");
        if (stored !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
