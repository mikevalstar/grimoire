<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Grimoire Books</title>
    <script>
      // Apply the theme before first paint so there's no flash of the wrong
      // canvas. Dark is the default; see src/lib/theme.ts.
      var stored = null;
      try {
        stored = localStorage.getItem("grimoire.theme");
      } catch {}
      if (stored !== "light") document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
