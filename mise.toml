# Toolchain for Grimoire Books. `mise install` to provision.
#
# Node is deliberately absent: it's managed by fnm on this setup, and every
# script here runs through Bun anyway (Vite, tsgo, Electrobun all launch via
# `bun run`).

[tools]
# Runtime + package manager for the whole workspace. Pinned so the lockfile in
# bun.lock and the `bun:sqlite` behaviour packages/core relies on stay stable.
bun = "1.3.14"

# okq: query/maintain the Markdown docs under docs/ (OKF bundle).
"github:mikevalstar/okq" = "0.8.0"

[env]
# Uncomment and point these at a scratch library/data dir to exercise
# first-run setup without touching the real Calibre library or grimoire.db.
# See the Gotchas section of CLAUDE.md.
# CALIBRE_LIBRARY = "{{config_root}}/.local/Calibre Library"
# GRIMOIRE_DATA_DIR = "{{config_root}}/.local/grimoire-data"
